                                                {isPendingAdmin && isAdmin && (
                                                    <div className="flex space-x-2 mt-5 md:mt-0">
                                                        <button onClick={() => handleAdminReject(req.id)} className="flex-1 md:flex-none bg-white text-red-600 border border-red-200 px-4 py-2.5 rounded text-sm font-bold hover:bg-red-50">Neka (Admin)</button>
                                                        <button onClick={() => handleAdminApprove(req.id)} className="flex-1 md:flex-none bg-green-600 text-white px-4 py-2.5 rounded text-sm font-bold shadow hover:bg-green-700">Godkänn byte</button>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* PERSONAL */}
                        {activeTab === 'personal' && isAdmin && (
                            <div className="max-w-3xl mx-auto space-y-6">
                                <div className="flex justify-between items-center mb-4 border-b pb-4">
                                    <h2 className="text-2xl font-bold">Personal & Rättigheter</h2>
                                    <button onClick={() => setShowUserModal(true)} className="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 shadow-md text-sm font-bold">+ Skapa ny</button>
                                </div>
                                <div className="bg-white rounded-lg shadow-sm border divide-y">
                                    {(users||[]).map(u => {
                                        if(!u) return null;
                                        return(
                                        <div key={u.id} className="p-4 flex justify-between items-center hover:bg-gray-50 transition">
                                            <div className="flex items-center space-x-3 md:space-x-4 overflow-hidden">
                                                <div className="min-w-[2.5rem] w-10 h-10 md:w-12 md:h-12 bg-gray-100 rounded-full flex items-center justify-center font-bold text-gray-500">{(u.name||'A').charAt(0)}</div>
                                                <div className="truncate">
                                                    <div className="font-bold text-sm md:text-base truncate">{u.name}</div>
                                                    <div className="text-[10px] md:text-xs text-gray-400 truncate">@{u.username} | {u.email || 'Ingen e-post'}</div>
                                                </div>
                                            </div>
                                            
                                            <div className="flex items-center space-x-2 md:space-x-4 pl-2">
                                                <span className={`px-2 py-1 md:px-3 rounded-full text-[9px] md:text-[10px] font-bold border ${u.role === 'Superadmin' ? 'bg-purple-50 border-purple-200 text-purple-700' : u.role === 'Admin' ? 'bg-indigo-50 border-indigo-200 text-indigo-700' : 'bg-gray-50 text-gray-500'}`}>{(u.role||'PERSONAL').toUpperCase()}</span>
                                                {u.id !== currentUser.id && u.role !== 'Superadmin' && ( 
                                                    <button onClick={() => { 
                                                        if(confirm("Är du säker på att du vill radera resursen och all dess tillhörande data? Detta kan inte ångras.")) {
                                                            setUsers((users||[]).filter(user => user && user.id !== u.id)); 
                                                            setTemplateShifts((templateShifts||[]).filter(s => s && s.userId !== u.id));
                                                            setActualShifts((actualShifts||[]).filter(s => s && s.userId !== u.id));
                                                            setLeaves((leaves||[]).filter(l => l && l.userId !== u.id));
                                                            setTradeRequests((tradeRequests||[]).filter(r => r && r.shift1UserId !== u.id && r.shift2UserId !== u.id));
                                                            addLog("Raderade personal", `Tog bort resursen ${u.name}`); 
                                                        } 
                                                    }} className="text-xl md:text-base text-gray-300 hover:text-red-500 p-1 md:ml-2">🗑️</button> 
                                                )}
                                            </div>
                                        </div>
                                    )})}
                                </div>
                            </div>
                        )}

                        {/* LOGGBOK */}
                        {activeTab === 'loggbok' && isAdmin && (
                            <div className="bg-white p-4 md:p-6 rounded-lg shadow-sm">
                                <div className="flex flex-col sm:flex-row justify-between sm:items-end mb-6 pb-6 border-b space-y-3 sm:space-y-0">
                                    <div>
                                        <h2 className="text-2xl md:text-3xl font-bold tracking-tight text-slate-800">Händelselogg</h2>
                                        <p className="text-sm text-gray-500 mt-1">Här sparas automatiskt alla ändringar i schemat.</p>
                                    </div>
                                    {(logs||[]).length > 0 && (
                                        <button onClick={() => { if(confirm("Vill du rensa hela loggen? Denna åtgärd kan inte ångras.")) setLogs([]); }} className="text-sm font-bold text-red-500 hover:text-red-700 bg-red-50 px-3 py-2 rounded self-start sm:self-auto">
                                            Rensa logg
                                        </button>
                                    )}
                                </div>
                                
                                <div className="overflow-x-auto border rounded bg-white">
                                    <table className="min-w-[600px] w-full divide-y">
                                        <thead className="bg-gray-50">
                                            <tr>
                                                <th className="px-4 py-3 text-left text-[10px] md:text-xs font-bold text-gray-500 uppercase w-32 border-b">Tidpunkt</th>
                                                <th className="px-4 py-3 text-left text-[10px] md:text-xs font-bold text-gray-500 uppercase w-32 border-b">Användare</th>
                                                <th className="px-4 py-3 text-left text-[10px] md:text-xs font-bold text-gray-500 uppercase w-40 border-b">Händelse</th>
                                                <th className="px-4 py-3 text-left text-[10px] md:text-xs font-bold text-gray-500 uppercase border-b">Detaljer</th>
                                            </tr>
                                        </thead>
                                        <tbody className="bg-white divide-y">
                                            {!(logs||[]).length && (
                                                <tr>
                                                    <td colSpan="4" className="px-4 py-8 text-center text-gray-400 italic text-sm">Inga händelser loggade ännu.</td>
                                                </tr>
                                            )}
                                            {(logs||[]).map(log => {
                                                if(!log) return null;
                                                return (
                                                <tr key={log.id} className="hover:bg-gray-50">
                                                    <td className="px-4 py-3 text-[10px] md:text-xs text-gray-500 whitespace-nowrap text-left border-b border-gray-100">{(log.timestamp||'').split(' ')[0]} <br className="md:hidden"/> {(log.timestamp||'').split(' ')[1]}</td>
                                                    <td className="px-4 py-3 text-[10px] md:text-xs font-bold text-slate-700 text-left border-b border-gray-100">{log.userName}</td>
                                                    <td className="px-4 py-3 text-[10px] md:text-xs font-medium text-indigo-600 text-left border-b border-gray-100">{log.action}</td>
                                                    <td className="px-4 py-3 text-[10px] md:text-xs text-gray-600 text-left border-b border-gray-100">{log.details}</td>
                                                </tr>
                                            )})}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* --- MODALER --- */}
                    
                    {/* MODAL: LÄGG TILL/REDIGERA RUTIN */}
                    {showRoutineModal && (
                        <div className="fixed inset-0 modal-bg flex items-center justify-center z-[100] p-4">
                            <div className="bg-white p-6 rounded-lg w-full max-w-lg shadow-2xl max-h-[90vh] overflow-y-auto">
                                <h3 className="text-xl font-bold mb-4">{editingRoutine ? 'Redigera lathund' : 'Skapa ny lathund'}</h3>
                                <form onSubmit={handleSaveRoutine} className="space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-gray-500">Titel</label>
                                        <input type="text" className="w-full text-base md:text-sm border p-3 md:p-2 rounded mt-1 bg-gray-50 focus:bg-white" placeholder="T.ex. Öppningsrutiner" value={routineData.title} onChange={e => setRoutineData({...routineData, title: e.target.value})} required />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-gray-500">Checklista / Beskrivning</label>
                                        <textarea className="w-full text-base md:text-sm border p-3 md:p-2 rounded mt-1 bg-gray-50 focus:bg-white" rows="6" placeholder="1. Gör detta...&#10;2. Gör sedan detta..." value={routineData.content} onChange={e => setRoutineData({...routineData, content: e.target.value})} required></textarea>
                                    </div>
                                    <div className="flex flex-col md:flex-row justify-end md:space-x-2 pt-4 space-y-2 md:space-y-0">
                                        <button type="button" onClick={() => {setShowRoutineModal(false); setEditingRoutine(null);}} className="w-full md:w-auto px-4 py-3 md:py-2 text-gray-500 border rounded hover:bg-gray-50">Avbryt</button>
                                        <button type="submit" className="w-full md:w-auto bg-indigo-600 text-white px-6 py-3 md:py-2 rounded shadow hover:bg-indigo-700 font-bold">Spara lathund</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: LÄGG TILL LEDIGHET */}
                    {showLeaveModal && (
                        <div className="fixed inset-0 modal-bg flex items-center justify-center z-[100] p-4">
                            <div className="bg-white p-6 rounded-lg w-full max-w-sm shadow-2xl max-h-[90vh] overflow-y-auto">
                                <h3 className="text-xl font-bold mb-4">Registrera frånvaro</h3>
                                <form onSubmit={handleAddLeave} className="space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-gray-500">Resurs</label>
                                        <select className="w-full text-base md:text-sm border p-3 md:p-2 rounded mt-1 bg-gray-50" value={leaveData.userId} onChange={e => setLeaveData({...leaveData, userId: e.target.value})} required>
                                            <option value="">Välj person...</option>
                                            {(users||[]).map(u => u && <option key={u.id} value={u.id}>{u.name}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-gray-500">Typ av frånvaro</label>
                                        <select className="w-full text-base md:text-sm border p-3 md:p-2 rounded mt-1 bg-gray-50" value={leaveData.type} onChange={e => setLeaveData({...leaveData, type: e.target.value})} required>
                                            <option value="Semester">Semester</option>
                                            <option value="Sjuk">Sjukdom</option>
                                            <option value="VAB">VAB / Föräldraledig</option>
                                            <option value="Tjänstledig">Övrig Tjänstledighet</option>
                                        </select>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-xs font-bold text-gray-500">Från datum</label>
                                            <input type="date" className="w-full text-base border p-3 md:p-2 rounded mt-1" value={leaveData.startDate} onChange={e => setLeaveData({...leaveData, startDate: e.target.value})} required />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-gray-500">Till datum</label>
                                            <input type="date" className="w-full text-base border p-3 md:p-2 rounded mt-1" value={leaveData.endDate} onChange={e => setLeaveData({...leaveData, endDate: e.target.value})} required />
                                        </div>
                                    </div>
                                    <div className="flex flex-col md:flex-row justify-end md:space-x-2 pt-4 space-y-2 md:space-y-0">
                                        <button type="button" onClick={() => setShowLeaveModal(false)} className="w-full md:w-auto px-4 py-3 md:py-2 text-gray-500 border rounded hover:bg-gray-50">Avbryt</button>
                                        <button type="submit" className="w-full md:w-auto bg-indigo-600 text-white px-6 py-3 md:py-2 rounded shadow font-bold hover:bg-indigo-700">Spara frånvaro</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: BEGÄR PASSBYTE */}
                    {showTradeModal && tradeShift1 && (
                        <div className="fixed inset-0 modal-bg flex items-center justify-center z-[100] p-4">
                            <div className="bg-white p-6 rounded-lg w-full max-w-lg shadow-2xl max-h-[90vh] overflow-y-auto">
                                <h3 className="text-xl font-bold mb-4">Begär passbyte</h3>
                                <div className="bg-blue-50 border border-blue-200 rounded p-3 mb-4 text-sm text-blue-800">
                                    <strong>Ditt pass:</strong> {formatShiftName(tradeShift1.id)}
                                </div>
                                <form onSubmit={handleCreateTrade} className="space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-gray-500">Välj kollegans pass att byta mot:</label>
                                        <select 
                                            className="w-full text-base md:text-sm border p-3 md:p-2 rounded mt-1 bg-gray-50" 
                                            value={tradeShift2Id} 
                                            onChange={e => setTradeShift2Id(e.target.value)} 
                                            required
                                        >
                                            <option value="">-- Välj ett pass i systemet --</option>
                                            {[...(templateShifts||[]), ...(actualShifts||[])]
                                                .filter(s => s && s.userId !== currentUser.id)
                                                .sort((a,b) => (a.userId||'').localeCompare(b.userId||''))
                                                .map(s => (
                                                    <option key={s.id} value={s.id}>
                                                        {formatShiftName(s.id)}
                                                    </option>
                                            ))}
                                        </select>
                                    </div>
                                    <div className="flex flex-col md:flex-row justify-end md:space-x-2 pt-4 space-y-2 md:space-y-0">
                                        <button type="button" onClick={() => {setShowTradeModal(false); setTradeShift1(null);}} className="w-full md:w-auto px-4 py-3 md:py-2 text-gray-500 border rounded hover:bg-gray-50">Avbryt</button>
                                        <button type="submit" className="w-full md:w-auto bg-blue-600 text-white px-6 py-3 md:py-2 rounded shadow hover:bg-blue-700 font-bold">Skicka förfrågan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* LÖSENORDSMODAL */}
                    {showPasswordModal && (
                        <div className="fixed inset-0 modal-bg flex items-center justify-center z-[100] p-4">
                            <div className="bg-white p-6 rounded-lg w-full max-w-sm shadow-2xl max-h-[90vh] overflow-y-auto">
                                <h3 className="text-xl font-bold mb-4">Byt lösenord</h3>
                                {passwordError && <div className="mb-4 bg-red-50 text-red-600 p-3 rounded text-xs border border-red-200">{passwordError}</div>}
                                <form onSubmit={handleChangePassword} className="space-y-4">
                                    <div><label className="text-xs font-bold text-gray-500">Nuvarande lösenord</label><input type="password" required className="w-full text-base border p-3 md:p-2 rounded mt-1" value={passwordData.old} onChange={e => setPasswordData({...passwordData, old: e.target.value})} /></div>
                                    <div><label className="text-xs font-bold text-gray-500">Nytt lösenord (minst 3 tecken)</label><input type="password" required minLength="3" className="w-full text-base border p-3 md:p-2 rounded mt-1" value={passwordData.new} onChange={e => setPasswordData({...passwordData, new: e.target.value})} /></div>
                                    <div><label className="text-xs font-bold text-gray-500">Bekräfta nytt lösenord</label><input type="password" required minLength="3" className="w-full text-base border p-3 md:p-2 rounded mt-1" value={passwordData.confirm} onChange={e => setPasswordData({...passwordData, confirm: e.target.value})} /></div>
                                    <div className="flex flex-col md:flex-row justify-end md:space-x-2 pt-4 space-y-2 md:space-y-0"><button type="button" onClick={() => {setShowPasswordModal(false); setPasswordError('');}} className="w-full md:w-auto px-4 py-3 md:py-2 text-gray-500 border rounded hover:bg-gray-50">Avbryt</button><button type="submit" className="w-full md:w-auto bg-indigo-600 text-white px-6 py-3 md:py-2 rounded shadow hover:bg-indigo-700 font-bold">Uppdatera</button></div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* SKAPA RESURS MODAL */}
                    {showUserModal && (
                        <div className="fixed inset-0 modal-bg flex items-center justify-center z-[100] p-4">
                            <div className="bg-white p-6 rounded-lg w-full max-w-sm shadow-2xl max-h-[90vh] overflow-y-auto">
                                <h3 className="text-xl font-bold mb-4">Skapa ny resurs</h3>
                                <form onSubmit={handleAddUser} className="space-y-4">
                                    <div><label className="text-xs font-bold text-gray-500">Fullständigt namn</label><input type="text" className="w-full text-base border p-3 md:p-2 rounded mt-1" value={newUser.name} onChange={e => setNewUser({...newUser, name: e.target.value})} required /></div>
                                    <div><label className="text-xs font-bold text-gray-500">Användarnamn</label><input type="text" className="w-full text-base border p-3 md:p-2 rounded mt-1" value={newUser.username} onChange={e => setNewUser({...newUser, username: e.target.value})} required /></div>
                                    <div><label className="text-xs font-bold text-gray-500">E-postadress</label><input type="email" className="w-full text-base border p-3 md:p-2 rounded mt-1" value={newUser.email} onChange={e => setNewUser({...newUser, email: e.target.value})} required /></div>
                                    <div><label className="text-xs font-bold text-gray-500">Roll</label><select className="w-full text-base border p-3 md:p-2 rounded mt-1" value={newUser.role} onChange={e => setNewUser({...newUser, role: e.target.value})}><option value="Personal">Personal</option><option value="Admin">Admin</option>{isSuperAdmin && <option value="Superadmin">Superadmin</option>}</select></div>
                                    
                                    <div className="bg-indigo-50 text-indigo-800 p-3 rounded text-xs border border-indigo-200 mt-2">
                                        <strong>Information:</strong> När du skapar resursen kommer systemet att generera ett lösenord och "skicka" ett välkomstmail till användaren där de uppmanas att logga in och byta sitt lösenord.
                                    </div>

                                    <div className="flex flex-col md:flex-row justify-end md:space-x-2 pt-4 space-y-2 md:space-y-0"><button type="button" onClick={() => setShowUserModal(false)} className="w-full md:w-auto px-4 py-3 md:py-2 text-gray-500 border rounded hover:bg-gray-50">Avbryt</button><button type="submit" className="w-full md:w-auto bg-indigo-600 text-white px-6 py-3 md:py-2 rounded font-bold">Skapa & skicka inbjudan</button></div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* LÄGG TILL I RULLSCHEMA MODAL */}
                    {showTemplateModal && (
                        <div className="fixed inset-0 modal-bg flex items-center justify-center z-[100] p-4">
                            <div className="bg-white p-6 rounded-lg w-full max-w-sm shadow-2xl max-h-[90vh] overflow-y-auto">
                                <h3 className="text-xl font-bold mb-4">Lägg till i rullschema</h3>
                                <form onSubmit={handleAddTemplateShift} className="space-y-4">
                                    <div className="grid grid-cols-1 gap-2">
                                        <label className="text-xs font-bold text-gray-500">Cykelvecka</label>
                                        <select className="border p-3 md:p-2 text-base rounded bg-gray-50 w-full" value={newTempShift?.week || 1} onChange={e => setNewTempShift({...newTempShift, week: e.target.value})}>
                                            {Array.from({ length: cycleWeeks }, (_, i) => i + 1).map(w => <option key={w} value={w}>Vecka {w}</option>)}
                                        </select>
                                    </div>
                                    
                                    {/* Snygga checkbox-knappar för flera dagar */}
                                    <div>
                                        <label className="text-xs font-bold text-gray-500 block mb-1">Välj veckodagar</label>
                                        <div className="flex flex-wrap gap-2">
                                            {["Mån","Tis","Ons","Tor","Fre","Lör","Sön"].map((d, i) => {
                                                const dayNum = i + 1;
                                                const isChecked = newTempShift?.days?.includes(dayNum);
                                                return (
                                                    <label key={d} className={`flex items-center space-x-1 border px-3 py-2 rounded-md cursor-pointer text-xs select-none transition-all ${isChecked ? 'bg-indigo-600 border-indigo-600 text-white font-bold shadow-sm' : 'bg-gray-50 border-gray-200 text-gray-600 hover:bg-gray-100'}`}>
                                                        <input 
                                                            type="checkbox" 
                                                            className="sr-only" 
                                                            checked={isChecked} 
                                                            onChange={(e) => {
                                                                const updatedDays = e.target.checked 
                                                                    ? [...new Set([...(newTempShift.days || []), dayNum])]
                                                                    : (newTempShift.days || []).filter(day => day !== dayNum);
                                                                setNewTempShift({...newTempShift, days: updatedDays});
                                                            }}
                                                        />
                                                        <span>{d}</span>
                                                    </label>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    {/* LÅSNING AV RESURS */}
                                    <div className="grid grid-cols-1 gap-2">
                                        <label className="text-xs font-bold text-gray-500">Tilldelad person</label>
                                        <select 
                                            className={`w-full border p-3 md:p-2 text-base rounded ${newTempShift?.lockUser ? 'bg-gray-200 cursor-not-allowed text-gray-500 font-bold' : 'bg-gray-50'}`} 
                                            value={newTempShift?.userId || ''} 
                                            onChange={e => !newTempShift?.lockUser && setNewTempShift({...newTempShift, userId: e.target.value})} 
                                            required 
                                            disabled={newTempShift?.lockUser}
                                        >
                                            <option value="">Välj person...</option>
                                            {(users||[]).map(u => u && <option key={u.id} value={u.id}>{u.name}</option>)}
                                        </select>
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <div><label className="text-xs font-bold text-gray-500">Starttid</label><select className="w-full text-base border p-3 md:p-2 rounded mt-1 bg-gray-50" value={newTempShift?.start || '08:00'} onChange={e => setNewTempShift({...newTempShift, start: e.target.value})}>{(TIME_OPTIONS||[]).map(time => <option key={`start-${time}`} value={time}>{time}</option>)}</select></div>
                                        <div><label className="text-xs font-bold text-gray-500">Sluttid</label><select className="w-full text-base border p-3 md:p-2 rounded mt-1 bg-gray-50" value={newTempShift?.end || '17:00'} onChange={e => setNewTempShift({...newTempShift, end: e.target.value})}>{(TIME_OPTIONS||[]).map(time => <option key={`end-${time}`} value={time}>{time}</option>)}</select></div>
                                    </div>
                                    <div className="flex flex-col md:flex-row justify-end md:space-x-2 pt-4 space-y-2 md:space-y-0"><button type="button" onClick={() => setShowTemplateModal(false)} className="w-full md:w-auto px-4 py-3 md:py-2 text-gray-500 border rounded hover:bg-gray-50">Avbryt</button><button type="submit" className="w-full md:w-auto bg-indigo-600 text-white px-6 py-3 md:py-2 rounded shadow font-bold hover:bg-indigo-700">Spara pass</button></div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* LÄGG TILL KALENDERPASS MODAL */}
                    {showActualShiftModal && (
                        <div className="fixed inset-0 modal-bg flex items-center justify-center z-[100] p-4">
                            <div className="bg-white p-6 rounded-lg w-full max-w-sm shadow-2xl max-h-[90vh] overflow-y-auto">
                                <h3 className="text-xl font-bold mb-2">Lägg till kalenderpass</h3>
                                <p className="text-sm text-gray-500 mb-4 font-bold">Datum: {newActualShift?.date || ''}</p>
                                <form onSubmit={handleAddActualShift} className="space-y-4">
                                    <select className="w-full border p-3 md:p-2 text-base rounded" value={newActualShift?.userId || ''} onChange={e => setNewActualShift({...newActualShift, userId: e.target.value})} required><option value="">Välj person...</option>{(users||[]).map(u => u && <option key={u.id} value={u.id}>{u.name}</option>)}</select>
                                    <div className="grid grid-cols-2 gap-2"><div><label className="text-xs font-bold text-gray-500">Starttid</label><select className="w-full text-base border p-3 md:p-2 rounded mt-1" value={newActualShift?.start || '08:00'} onChange={e => setNewActualShift({...newActualShift, start: e.target.value})}>{(TIME_OPTIONS||[]).map(time => <option key={`start-${time}`} value={time}>{time}</option>)}</select></div><div><label className="text-xs font-bold text-gray-500">Sluttid</label><select className="w-full text-base border p-3 md:p-2 rounded mt-1" value={newActualShift?.end || '17:00'} onChange={e => setNewActualShift({...newActualShift, end: e.target.value})}>{(TIME_OPTIONS||[]).map(time => <option key={`end-${time}`} value={time}>{time}</option>)}</select></div></div>
                                    <div className="flex flex-col md:flex-row justify-end md:space-x-2 pt-4 space-y-2 md:space-y-0"><button type="button" onClick={() => setShowActualShiftModal(false)} className="w-full md:w-auto px-4 py-3 md:py-2 text-gray-500 border rounded hover:bg-gray-50">Avbryt</button><button type="submit" className="w-full md:w-auto bg-green-600 text-white px-6 py-3 md:py-2 rounded shadow hover:bg-green-700 font-bold">Spara</button></div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* REDIGERA BEFINTLIGT PASS MODAL */}
                    {editingShift && (
                        <div className="fixed inset-0 modal-bg flex items-center justify-center z-[100] p-4">
                            <div className="bg-white p-6 rounded-lg w-full max-w-sm shadow-2xl max-h-[90vh] overflow-y-auto">
                                <h3 className="text-xl font-bold mb-4">Redigera pass</h3>
                                {!editingShift.isExtra && !editingShift.targetDateStr && <div className="mb-4 bg-orange-50 text-orange-800 p-3 rounded text-xs border border-orange-200"><strong>OBS:</strong> Detta pass tillhör rullschemat. Ändrar du här, ändras den för <strong>alla kommande veckor</strong>.</div>}
                                {!editingShift.isExtra && editingShift.targetDateStr && <div className="mb-4 bg-indigo-50 text-indigo-800 p-3 rounded text-xs border border-indigo-200"><strong>TILLFÄLLIG ÄNDRING:</strong> Ändringar här gäller <strong>endast</strong> för valt datum: {editingShift.targetDateStr}.</div>}
                                <form onSubmit={handleSaveEditShift} className="space-y-4">
                                    <div><label className="text-xs font-bold text-gray-500">Tilldelad resurs</label><select className="w-full text-base border p-3 md:p-2 rounded mt-1" value={editingShift?.userId || ''} onChange={e => setEditingShift({...editingShift, userId: e.target.value})} required><option value="">Välj person...</option>{(users||[]).map(u => u && <option key={u.id} value={u.id}>{u.name}</option>)}</select></div>
                                    <div className="grid grid-cols-2 gap-2"><div><label className="text-xs font-bold text-gray-500">Starttid</label><select className="w-full text-base border p-3 md:p-2 rounded mt-1" value={editingShift?.start || '08:00'} onChange={e => setEditingShift({...editingShift, start: e.target.value})}>{(TIME_OPTIONS||[]).map(time => <option key={`edit-start-${time}`} value={time}>{time}</option>)}</select></div><div><label className="text-xs font-bold text-gray-500">Sluttid</label><select className="w-full text-base border p-3 md:p-2 rounded mt-1" value={editingShift?.end || '17:00'} onChange={e => setEditingShift({...editingShift, end: e.target.value})}>{(TIME_OPTIONS||[]).map(time => <option key={`edit-end-${time}`} value={time}>{time}</option>)}</select></div></div>
                                    <div className="flex flex-col md:flex-row justify-end md:space-x-2 pt-4 space-y-2 md:space-y-0"><button type="button" onClick={() => setEditingShift(null)} className="w-full md:w-auto px-4 py-3 md:py-2 text-gray-500 border rounded hover:bg-gray-50">Avbryt</button><button type="submit" className="w-full md:w-auto bg-indigo-600 text-white px-6 py-3 md:py-2 rounded shadow hover:bg-indigo-700 font-bold">Spara ändringar</button></div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
